[package]
name = "p2pcv-server"
version = "0.1.2-snapshot"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Relacibo/p2pcv-server"

[[bin]]
name = "app"
path = "src/main.rs"

[workspace]

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
sea-orm = { version = "1.1", features = [
  "sqlx-postgres",
  "runtime-tokio-native-tls",
  "macros",
  "with-uuid",
  "with-chrono",
] }
sea-orm-migration = { version = "1.1", features = [
  "sqlx-postgres",
  "runtime-tokio-native-tls",
] }
env_logger = "^0.11.5"
serde = { version = "^1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
serde_json = "1.0.149"
uuid = { version = "1.23", features = ["serde", "v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.3", features = ["json", "form"] }
dotenvy = "0.15.7"
base64 = "0.22"
tokio = { version = "1.52", features = ["full"] }
thiserror = "2.0.18"
serde_with = { version = "3.20", features = ["chrono", "base64"] }
log = "0.4.29"
async-trait = "0.1.89"
validator = { version = "0.20", features = ["derive"] }
rand = "0.8.6"
futures = "0.3.32"
dashmap = "6.1.0"
p2pcv-bebop = { path = "libs/pvpcv_bebop" }
migration = { path = "migration" }
libp2p = { version = "0.56.0", features = [
  "ed25519",
  "gossipsub",
  "macros",
  "tokio",
  "ping",
  "request-response",
  "relay",
  "identify",
] }
libp2p-webrtc = { version = "0.9.0-alpha.1", features = ["tokio", "pem"] }
http = "1.4.0"
rustls = { version = "0.23", features = ["ring"] }
