services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-data}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql

volumes:
  db-data:
