syntax = "proto3";

package org.ggchess.client_to_server;

message Msg {
  oneof c2s {
    RegisterPeer register_peer = 1;
    GetFriendPeerId get_friend_peer_id = 2;
    NewGame new_game = 3;
    NewGameAnswer new_game_answer = 4;
  }
}

// Authenticate the libp2p connection with a JWT token so the server
// can map this peer ID to a user account.
message RegisterPeer {
  bytes auth_token = 1;
}

// Ask the server for the libp2p peer ID of a friend so the client
// can dial them directly.
message GetFriendPeerId {
  bytes friend_user_id = 1;
}

// Request a new game against a friend. The server relays a NewGameEvent
// to the receiver and waits for their answer before responding.
message NewGame {
  bytes receiver_user_id = 1;
  bytes variant_id = 2;
  string variant_version = 3;
}

// Client's answer to an incoming NewGameEvent from the server.
message NewGameAnswer {
  bool accepted = 1;
}
