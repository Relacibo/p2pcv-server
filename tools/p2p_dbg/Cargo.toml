[package]
name = "p2p_dbg"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "0.4.29"
env_logger = "^0.11.5"
tokio = { version = "1.52", features = ["full"] }
anyhow = "1.0.88"
futures-util = "0.3.32"
p2pcv-bebop = { path = "../../libs/pvpcv_bebop" }
uuid = "1.23"
libp2p = { version = "0.56.0", features = [
  "ed25519",
  "gossipsub",
  "macros",
  "tokio",
  "ping",
  "request-response"
] }
libp2p-webrtc = { version = "0.9.0-alpha.1", features = [
  "tokio",
  "pem"
] }
rand = "0.8.6"
base64 = "0.22"
dotenvy = "0.15.7"
